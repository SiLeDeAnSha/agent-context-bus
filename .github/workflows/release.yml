name: Release Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run stdlib upgrade test suite
        run: python3 -m unittest -v test_v05_upgrades.py

      - name: Build release archive and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          ZIP_NAME="agent-context-bus-${TAG}.zip"
          git archive --format=zip --prefix="agent-context-bus-${TAG}/" "${TAG}" -o "dist/${ZIP_NAME}"
          (cd dist && sha256sum "${ZIP_NAME}" > SHA256SUMS.txt)
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE="docs/releases/${TAG}.md"
          TITLE="${TAG}"
          if [ -f "${NOTES_FILE}" ]; then
            FIRST_LINE=$(head -n 1 "${NOTES_FILE}" | sed 's/^#* *//')
            if [ -n "${FIRST_LINE}" ]; then
              TITLE="${FIRST_LINE}"
            fi
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "dist/agent-context-bus-${TAG}.zip" "dist/SHA256SUMS.txt" --clobber
            if [ -f "${NOTES_FILE}" ]; then
              gh release edit "${TAG}" --title "${TITLE}" --notes-file "${NOTES_FILE}"
            fi
          else
            if [ -f "${NOTES_FILE}" ]; then
              gh release create "${TAG}" \
                "dist/agent-context-bus-${TAG}.zip" \
                "dist/SHA256SUMS.txt" \
                --title "${TITLE}" \
                --notes-file "${NOTES_FILE}"
            else
              gh release create "${TAG}" \
                "dist/agent-context-bus-${TAG}.zip" \
                "dist/SHA256SUMS.txt" \
                --title "${TITLE}" \
                --generate-notes
            fi
          fi
